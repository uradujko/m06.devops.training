version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Run terraform
    dependencies: []
    task:
      jobs:
        - name: Initialize
          commands:
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: 'Block #2'
    dependencies:
      - Run terraform
    task:
      jobs:
        - name: Deploy
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
  - name: 'Block #3'
    dependencies:
      - 'Block #2'
    task:
      jobs:
        - name: Use
          commands:
            - cd 1-terraform-apply
            - 'aws s3 cp README.md s3://group1-uros/'
            - 'aws s3 ls s3://group1-uros'
            - 'aws s3 rm s3://group1-uros/README.md'
      secrets:
        - name: localstack
  - name: 'Block #4'
    dependencies:
      - 'Block #3'
    task:
      jobs:
        - name: Destroy
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform destroy -auto-approve
      secrets:
        - name: localstack
  - name: 'Block #5'
    dependencies:
      - Run terraform
    task:
      jobs:
        - name: Deploy
          commands:
            - cd 2-terraform-ec2
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - cp terraform.tfstate terraform.tfstate_
            - artifact push workflow terraform.tfstate_
      secrets:
        - name: localstack
  - name: 'Block #6'
    dependencies:
      - 'Block #5'
    task:
      jobs:
        - name: Destroy
          commands:
            - cd 2-terraform-ec2
            - artifact pull workflow terraform.tfstate_
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - cp terraform.tfstate_ terraform.tfstate
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform destroy -auto-approve
      secrets:
        - name: localstack
  - name: 'Block #7'
    dependencies:
      - Run terraform
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Deploy
          commands:
            - cd 3-terraform-dynamodb
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - cp terraform.tfstate terraform.tfstate__
            - artifact push workflow terraform.tfstate__
  - name: 'Block #8'
    dependencies:
      - 'Block #7'
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Interact with the table
          commands:
            - cd 3-terraform-dynamodb
            - aws dynamodb list-tables
            - aws dynamodb describe-table --table-name table-uros
            - aws dynamodb put-item \
            - '        --table-name table-uros \'
            - '        --item ''{'
            - '            "user_id": {"S": "u1"},'
            - '            "name": {"S": "Alice"},'
            - '            "email": {"S": "alice@example.com"}'
            - '          }'''
            - aws dynamodb scan --table-name table-uros
