version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - cd 1-terraform-apply
blocks:
  - name: Run terraform
    dependencies: []
    task:
      jobs:
        - name: Initialize
          commands:
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: 'Block #2'
    dependencies:
      - Run terraform
    task:
      jobs:
        - name: Deploy
          commands:
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
  - name: 'Block #3'
    dependencies:
      - 'Block #2'
    task:
      jobs:
        - name: Use
          commands:
            - 'aws s3 cp README.md s3://group1-uros/'
            - 'aws s3 ls s3://group1-uros'
            - 'aws s3 rm s3://group1-uros/README.md'
      secrets:
        - name: localstack
  - name: 'Block #4'
    dependencies:
      - 'Block #3'
    task:
      jobs:
        - name: Destroy
          commands:
            - artifact pull
            - terraform destroy -auto-approve
      secrets:
        - name: localstack
