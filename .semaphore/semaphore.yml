version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Run terraform
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - checkout
            - aws s3 ls
            - terraform init
            - artifact push workflow .terraform
            - terraform plan
            - terraform apply -auto-approve
            - terraform destroy -auto-approve
      secrets:
        - name: localstack
