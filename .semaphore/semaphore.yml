version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - cd 1-terraform-apply
blocks:
  - name: Run terraform
    dependencies: []
    task:
      jobs:
        - name: Initialize
          commands:
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: 'Block #2'
    dependencies:
      - Run terraform
    task:
      jobs:
        - name: Deploy
          commands:
            - aws s3 ls
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
  - name: 'Block #3'
    dependencies:
      - 'Block #2'
    task:
      jobs:
        - name: 'Job #1'
          commands: []
  - name: 'Block #4'
    dependencies:
      - 'Block #3'
    task:
      jobs:
        - name: 'Job #1'
          commands: []
